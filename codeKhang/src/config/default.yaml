# =============================================================================
# YOLO-Multimodal Configuration
# =============================================================================

model:
  hidden_dim: 256
  dropout_prob: 0.3
  fusion:
    mode: "current_fusion"
    gate_init: 0.0
  visual_baseline:
    mode: "projected_fusion"

  text_encoder:
    model_name: "vinai/phobert-base-v2"
    hidden_size: 768
    max_text_length: 128
    pooling_mode: "full"
    phase2_unfreeze_last_n_layers: 2
    unfreeze_embeddings: false

  visual_encoder:
    model_size: "n"
    pretrained: true
    freeze_backbone: true
    feature_source: "detect_f"
    feature_scales:
      - "P3"
      - "P4"
      - "P5"

data:
  image_size: 640
  text_dropout:
    enabled: false
    train_drop_prob: 0.1
    apply_to_val: false
    apply_to_test: false
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  num_classes: 5
  train_annotations: "/content/Multimodal-YOLOv11/data/train_annotations.json"
  val_annotations: "/content/Multimodal-YOLOv11/data/val_annotations.json"
  train_image_dir: "/content/Multimodal-YOLOv11/datasets/train/images/"
  val_image_dir: "/content/Multimodal-YOLOv11/datasets/valid/images/"

  batch_size: 64
  num_workers: 8
  pin_memory: true

training:
  checkpoint_selection:
    baseline_metrics_path: "checkpoints/yolov11_baseline_metrics.json"
    recall_floor_tolerance: 0.005
  phase1:
    epochs: 20
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4

  phase2:
    epochs: 30
    visual_backbone_lr: 1.0e-4
    text_backbone_lr: 5.0e-5
    head_lr: 5.0e-4
    weight_decay: 1.0e-3

  early_stopping:
    patience: 7
    min_delta: 0.001

  optimizer: "AdamW"
  scheduler: "cosine"
  save_dir: "checkpoints/"
  save_every: 5

device: "auto"
seed: 42

gemini:
  model_name: "gemini-2.5-flash"
  prompt_count: 150
  cache_path: "data/prompt_cache.json"
